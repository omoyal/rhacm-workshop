apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: demo-etcd-encryption
  namespace: demo-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: SC System and Communications Protection
    policy.open-cluster-management.io/controls: SC-28 Protection Of Information At Rest
spec:
  disabled: false
  policy-templates:
    # Turns on etcd encryption
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: demo-etcd-encryption
        spec:
          remediationAction: enforce
          pruneObjectBehavior: DeleteIfCreated
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: APIServer
                metadata:
                  name: cluster
                spec:
                  encryption:
                    type: aescbc
    # Reports when encryption is complete
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: demo-etcd-encryption-status
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operator.openshift.io/v1
                kind: KubeAPIServer
                metadata:
                  name: cluster
                status:
                  conditions:
                    - type: Encrypted
                      status: "True"
                      reason: EncryptionCompleted
            - complianceType: musthave
              objectDefinition:
                apiVersion: operator.openshift.io/v1
                kind: OpenShiftAPIServer
                metadata:
                  name: cluster
                status:
                  conditions:
                    - type: Encrypted
                      status: "True"
                      reason: EncryptionCompleted
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: demo-etcd-encryption-placement
  namespace: demo-policies
spec:
  clusterSets:
    - default
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: name
              operator: In
              values: [cluster1]
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: demo-etcd-encryption-binding
  namespace: demo-policies
placementRef:
  name: demo-etcd-encryption-placement
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: demo-etcd-encryption
    kind: Policy
    apiGroup: policy.open-cluster-management.io
