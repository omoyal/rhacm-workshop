apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: demo-no-kubeadmin
  namespace: demo-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: AC Access Control
    policy.open-cluster-management.io/controls: AC-2 Account Management
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: demo-no-kubeadmin
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            # The temporary kubeadmin user must be removed after setup
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: kubeadmin
                  namespace: kube-system
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: demo-no-public-cluster-admin
  namespace: demo-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: AC Access Control
    policy.open-cluster-management.io/controls: AC-6 Least Privilege
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: demo-no-public-cluster-admin
        spec:
          remediationAction: inform
          severity: critical
          object-templates:
            # No one may grant cluster-admin to all authenticated users
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: cluster-admin
                subjects:
                  - apiGroup: rbac.authorization.k8s.io
                    kind: Group
                    name: system:authenticated
---
apiVersion: policy.open-cluster-management.io/v1beta1
kind: PolicySet
metadata:
  name: demo-org-security-baseline
  namespace: demo-policies
spec:
  description: Organization-wide security baseline
  policies:
    - demo-no-kubeadmin
    - demo-no-public-cluster-admin
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: demo-org-security-baseline-placement
  namespace: demo-policies
spec:
  clusterSets:
    - default
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: name
              operator: In
              values: [cluster1]
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: demo-org-security-baseline-binding
  namespace: demo-policies
placementRef:
  name: demo-org-security-baseline-placement
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: demo-org-security-baseline
    kind: PolicySet
    apiGroup: policy.open-cluster-management.io
