apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: demo-scc
  namespace: demo-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: AC Access Control
    policy.open-cluster-management.io/controls: AC-6 Least Privilege
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: demo-scc
        spec:
          remediationAction: enforce
          pruneObjectBehavior: DeleteIfCreated
          severity: high
          object-templates:
            # The organizational SCC
            - complianceType: musthave
              objectDefinition:
                apiVersion: security.openshift.io/v1
                kind: SecurityContextConstraints
                metadata:
                  name: demo-restricted-org
                allowHostDirVolumePlugin: false
                allowHostIPC: false
                allowHostNetwork: false
                allowHostPID: false
                allowHostPorts: false
                allowPrivilegeEscalation: false
                allowPrivilegedContainer: false
                allowedCapabilities:
                  - NET_BIND_SERVICE
                requiredDropCapabilities:
                  - ALL
                fsGroup:
                  type: MustRunAs
                runAsUser:
                  type: MustRunAsRange
                seLinuxContext:
                  type: MustRunAs
                supplementalGroups:
                  type: RunAsAny
                seccompProfiles:
                  - runtime/default
                readOnlyRootFilesystem: false
                users: []
                groups: []
                volumes:
                  - configMap
                  - csi
                  - downwardAPI
                  - emptyDir
                  - ephemeral
                  - persistentVolumeClaim
                  - projected
                  - secret
            # A ClusterRole that allows using the SCC (bind it to service accounts)
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRole
                metadata:
                  name: demo-use-restricted-org-scc
                rules:
                  - apiGroups: ["security.openshift.io"]
                    resources: ["securitycontextconstraints"]
                    resourceNames: ["demo-restricted-org"]
                    verbs: ["use"]
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: demo-scc-placement
  namespace: demo-policies
spec:
  clusterSets:
    - default
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: name
              operator: In
              values: [cluster1]
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: demo-scc-binding
  namespace: demo-policies
placementRef:
  name: demo-scc-placement
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: demo-scc
    kind: Policy
    apiGroup: policy.open-cluster-management.io
